// OpenMerc (V1): Apply on the video page
// RLabs 2026-11-05: full screen and brightness are set by om_vidapply, which restarts the renderer only when one of
// them (or the resolution) changed - a restart drops macOS Game Mode while the window is rebuilt
// RLabs 2026-11-05: only the rows the page still shows (om_video.tbl)
set fov $menu_fov
set scr_hudscale $menu_hudscale
om_vidapply

set menu_settings_changed 0

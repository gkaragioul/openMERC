//----------------------------------------------
// OpenMerc (V1) / RLabs: DEFAULT VIDEO SETTINGS - the Defaults button of the video page
// RLabs 2026-11-05: the Mac full screen at the desktop resolution, Performance (120 fps). The renderer is
// not changed here (the Mac app always runs Metal)
//----------------------------------------------

set r_mode                      -2
set vid_fullscreen              2
set r_vsync                     1
set r_graphics                  0

set fov                         95
set horplus                     1
set scr_aspect                  1
set scr_hudscale                0
set scr_textscale               1

set vid_gamma                   0.0
set vid_contrast                0.6
set vid_brightness              0.6

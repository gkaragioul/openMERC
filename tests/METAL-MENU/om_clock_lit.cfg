exec om_clock_common.cfg
set menu_layout 1
set menu_ttf 1
set ui_scale 1.5
set om_clock_skin "Dekker"
set om_clock_team 0
set om_clock_player 0
menu om_clock_lit
set scr_menuoverlay 1
om_after 2 "om_menukey none 0 0"
om_after 3 "om_menudump"
om_after 4 "clear"
om_after 10 "om_menushot clock_lit_model"
om_after 14 "menuoff;set om_menutesttime -1;quit"

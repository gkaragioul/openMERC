// Run at 1920x1080 with an isolated user directory.
exec om_clock_common.cfg
set menu_layout 1
set menu_ttf 1
set ui_scale 2
menu om_clock_page
set scr_menuoverlay 1
om_after 2 "om_menukey none 0 0"
om_after 3 "om_menudump"
om_after 4 "clear"
om_after 8 "om_menushot clock_modern_page"
om_after 12 "menuoff;set menu_livebg 1;menu om_clock_model;set scr_menuoverlay 1"
om_after 14 "om_menukey none 0 0"
om_after 15 "om_menudump"
om_after 16 "clear"
om_after 20 "om_menushot clock_modern_model"
om_after 24 "menuoff;set om_menutesttime -1;quit"

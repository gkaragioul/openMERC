// Set before creating any fixture screen; test clock is never archived.
menuoff
// Offline mode otherwise forces a full console, including its real-time stamp.
// Each capture config sets scr_menuoverlay after every menuoff/menu transition.
set menu_livebg 0
set gl_clear 1
set gl_ztrick 0
set con_notifytime -1
clear
set om_menutesttime 1000
set om_menusoft 0
set scr_aspect 1
set menu_textsize 1
set menu_rail 0
set menu_gamepad 0
set menu_mouse_x 0
set menu_mouse_y 0
set om_clock_text "0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ"
set om_clock_slider 4
set om_clock_list 1
